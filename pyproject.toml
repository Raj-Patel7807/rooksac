[project]
name = "rooksac"
version = "0.1.0"
description = "Autonomous C++20 Chess Engine & Web Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
research = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
]

[tool.uv]
# This project is a mixed C++/Python application, not a distributable Python package.
# uv manages dependencies only; no wheel is built from this repo.
package = false
