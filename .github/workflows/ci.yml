name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    name: Code Quality & Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and formatting tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-12 clang-format-15 ninja-build
          python3 -m pip install --user cmake==3.28.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure CMake
        run: cmake --preset debug -DCMAKE_CXX_COMPILER=g++-12
      - name: Check C++ formatting
        run: cmake --build --preset debug --target format-check

  linux-engine-build-and-test:
    name: Native Engine Linux ${{ matrix.compiler }} (${{ matrix.configuration }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC 12
            cxx: g++-12
            configuration: debug
          - compiler: GCC 12
            cxx: g++-12
            configuration: release
          - compiler: Clang 15
            cxx: clang++-15
            configuration: debug
          - compiler: Clang 15
            cxx: clang++-15
            configuration: release
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-12 clang-15 ninja-build
          python3 -m pip install --user cmake==3.28.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure CMake
        run: cmake --preset ${{ matrix.configuration }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build Engine & Tests
        run: cmake --build --preset ${{ matrix.configuration }} --parallel
      - name: Run Engine Tests
        run: ctest --preset ${{ matrix.configuration }} --output-on-failure

  sanitizers:
    name: Clang ASan and UBSan
    runs-on: ubuntu-22.04
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-15 ninja-build
          python3 -m pip install --user cmake==3.28.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure CMake
        run: cmake --preset clang-asan-ubsan
      - name: Build with Sanitizers
        run: cmake --build --preset clang-asan-ubsan --parallel
      - name: Run Sanitized Tests
        run: ctest --preset clang-asan-ubsan --output-on-failure

  python-tests:
    name: Python ML & Backend Test Suites
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Run Research NN Pipeline Tests
        run: python -m unittest discover -s research/tests
      - name: Run Backend API Tests
        run: python -m unittest discover -s app/backend/tests

  frontend-tests:
    name: Frontend Test & Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install Dependencies
        working-directory: app/frontend
        run: npm ci
      - name: Run Vitest Unit Tests
        working-directory: app/frontend
        run: npm test
      - name: Run Production Bundle Build
        working-directory: app/frontend
        run: npm run build
