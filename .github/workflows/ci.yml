name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    linux-build-and-test:
        name: Linux ${{ matrix.compiler }} (${{ matrix.configuration }})
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - compiler: GCC 12
                      cxx: g++-12
                      configuration: debug
                    - compiler: GCC 12
                      cxx: g++-12
                      configuration: release
                    - compiler: Clang 15
                      cxx: clang++-15
                      configuration: debug
                    - compiler: Clang 15
                      cxx: clang++-15
                      configuration: release
        steps:
            - uses: actions/checkout@v4
            - name: Install pinned build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes g++-12 clang-15 clang-tidy-15 clang-format-15 ninja-build
                  python3 -m pip install --user cmake==3.28.3
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            - name: Configure
              run: cmake --preset ${{ matrix.configuration }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
            - name: Build
              run: cmake --build --preset ${{ matrix.configuration }} --parallel
            - name: Test
              run: ctest --preset ${{ matrix.configuration }}

    format:
        name: Formatting
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - name: Install pinned formatting tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes g++-12 clang-format-15 ninja-build
                  python3 -m pip install --user cmake==3.28.3
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            - name: Configure
              run: cmake --preset debug -DCMAKE_CXX_COMPILER=g++-12
            - name: Check formatting
              run: cmake --build --preset debug --target format-check

    static-analysis:
        name: Clang-Tidy
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - name: Install pinned static-analysis tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes clang-15 clang-tidy-15 ninja-build
                  python3 -m pip install --user cmake==3.28.3
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            - name: Configure
              run: cmake --preset clang-tidy
            - name: Build with clang-tidy
              run: cmake --build --preset clang-tidy --parallel
            - name: Test
              run: ctest --preset clang-tidy

    sanitizers:
        name: Clang ASan and UBSan
        runs-on: ubuntu-22.04
        env:
            ASAN_OPTIONS: detect_leaks=1
            UBSAN_OPTIONS: halt_on_error=1
        steps:
            - uses: actions/checkout@v4
            - name: Install pinned sanitizer tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes clang-15 ninja-build
                  python3 -m pip install --user cmake==3.28.3
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            - name: Configure
              run: cmake --preset clang-asan-ubsan
            - name: Build
              run: cmake --build --preset clang-asan-ubsan --parallel
            - name: Test
              run: ctest --preset clang-asan-ubsan

    windows-build-and-test:
        name: Windows MSVC Debug
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@v4
            - name: Configure
              run: cmake --preset windows-debug
            - name: Build
              run: cmake --build --preset windows-debug --parallel
            - name: Test
              run: ctest --preset windows-debug
