name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    engine-build-and-test:
        name: C++ Engine (Ubuntu, GCC)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install build tools
              run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build g++

            - name: Configure
              run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DROOKSAC_WARNINGS_AS_ERRORS=OFF

            - name: Build
              run: cmake --build build --parallel

            - name: Test
              run: ctest --test-dir build --output-on-failure

    backend-tests:
        name: Backend API Tests (Python / uv)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  version: "latest"
                  enable-cache: true

            - name: Set up Python
              run: uv python install 3.12

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run Backend tests
              run: uv run python -m unittest discover -s app/backend/tests

            - name: Run ML & Research tests
              run: uv run python -m unittest discover -s research/tests

    frontend-build-and-test:
        name: Frontend (Node)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
                  cache-dependency-path: app/frontend/package-lock.json

            - name: Install
              working-directory: app/frontend
              run: npm ci

            - name: Test
              working-directory: app/frontend
              run: npm test

            - name: Build
              working-directory: app/frontend
              run: npm run build
