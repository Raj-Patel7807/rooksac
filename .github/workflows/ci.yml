name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-build-and-test:
    name: C++ Engine Build & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DROOKSAC_WARNINGS_AS_ERRORS=OFF

      - name: Build Engine & Tests
        run: cmake --build build --parallel

      - name: Run Engine Tests (CTest)
        run: ctest --test-dir build --output-on-failure

  python-tests:
    name: Backend & ML Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run Backend Tests
        run: python -m unittest discover -s app/backend/tests

      - name: Run ML Tests
        run: python -m unittest discover -s research/tests

  frontend-build-and-test:
    name: Frontend Build & Test (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Run Unit Tests
        working-directory: app/frontend
        run: npm test

      - name: Build Production Assets
        working-directory: app/frontend
        run: npm run build
