services:
    backend:
        build:
            context: ../..
            dockerfile: deploy/docker/Dockerfile.backend
        container_name: rooksac-backend
        restart: unless-stopped
        environment:
            - ENVIRONMENT=production
            - PORT=8000
            - ENGINE_BINARY_PATH=/opt/rooksac/bin/rooksac
            - ENGINE_MODEL_PATH=/opt/rooksac/models/model_test.rks
            - ENGINE_EVAL_MODE=Neural
            - ENGINE_USE_POLICY=false
            - MAX_CONCURRENT_WORKERS=4
            - JOB_TIMEOUT_SECONDS=30.0
            - ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000
        networks:
            - internal-net
        expose:
            - "8000"
        ports:
            - "8000:8000"

    frontend:
        build:
            context: ../..
            dockerfile: deploy/docker/Dockerfile.frontend
        container_name: rooksac-frontend
        restart: unless-stopped
        ports:
            - "8080:8080"
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - internal-net

networks:
    internal-net:
        driver: bridge
